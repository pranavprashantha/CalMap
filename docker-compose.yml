services:
  db:
    image: pgvector/pgvector:pg17
    container_name: calmap-db
    environment:
      POSTGRES_USER: calmap
      POSTGRES_PASSWORD: calmap_dev
      POSTGRES_DB: calmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first creation of the volume only.
      - ./backend/scripts/init_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmap -d calmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
