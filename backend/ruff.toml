line-length = 100
target-version = "py314"

[lint]
select = ["E", "F", "B", "I", "UP"]

[lint.flake8-bugbear]
# FastAPI's dependency injection requires these calls in parameter defaults.
# Without this, B008 flags every route and dependency in the codebase.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
